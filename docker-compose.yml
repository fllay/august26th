services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-august26th}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-august26th}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      GOOGLE_FORMS_MCP_PATH: /opt/google-forms-mcp/build/index.js
      GOOGLE_OAUTH_TOKEN_PATH: /data/google-oauth.json
      PG_CONN_STR: ${PG_CONN_STR:-postgresql://postgres:postgres@postgres:5432/august26th}
      FORM_RESPONSE_PG_CONN_STR: ${FORM_RESPONSE_PG_CONN_STR:-}
    ports:
      - "2024:2024"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - google_oauth_data:/data
      - langgraph_runtime_data:/app/.langgraph_api
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:2024/info', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

  webui:
    build:
      context: ./agent-chat-ui
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_ASSISTANT_ID: ${WEBUI_ASSISTANT_ID:-agent}
    environment:
      NEXT_PUBLIC_ASSISTANT_ID: ${WEBUI_ASSISTANT_ID:-agent}
      LANGGRAPH_API_URL: ${WEBUI_LANGGRAPH_API_URL}
      WEBUI_APP_URL: ${WEBUI_APP_URL:-}
      GOOGLE_OAUTH_TOKEN_PATH: /data/google-oauth.json
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      PG_CONN_STR: ${PG_CONN_STR:-postgresql://postgres:postgres@postgres:5432/august26th}
    ports:
      - "3000:3000"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - google_oauth_data:/data
    depends_on:
      backend:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    command:
      [
        "tunnel",
        "--no-autoupdate",
        "run",
        "--token",
        "${CLOUDFLARED_TUNNEL_TOKEN}",
      ]
    restart: unless-stopped
    network_mode: "service:webui"
    depends_on:
      webui:
        condition: service_started

volumes:
  google_oauth_data:
  langgraph_runtime_data:
  postgres_data:
