services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      GOOGLE_FORMS_MCP_PATH: /opt/google-forms-mcp/build/index.js
    ports:
      - "2024:2024"

  webui:
    build:
      context: ./agent-chat-ui
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:2024
        NEXT_PUBLIC_ASSISTANT_ID: agent
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:2024
      NEXT_PUBLIC_ASSISTANT_ID: agent
      LANGGRAPH_API_URL: http://backend:2024
    ports:
      - "3000:3000"
    depends_on:
      - backend
