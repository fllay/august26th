services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      GOOGLE_FORMS_MCP_PATH: /opt/google-forms-mcp/build/index.js
      GOOGLE_OAUTH_TOKEN_PATH: /data/google-oauth.json
    ports:
      - "2024:2024"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - google_oauth_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:2024/info', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  webui:
    build:
      context: ./agent-chat-ui
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_ASSISTANT_ID: ${WEBUI_ASSISTANT_ID:-agent}
    environment:
      NEXT_PUBLIC_ASSISTANT_ID: ${WEBUI_ASSISTANT_ID:-agent}
      LANGGRAPH_API_URL: ${WEBUI_LANGGRAPH_API_URL}
      WEBUI_APP_URL: ${WEBUI_APP_URL:-}
      GOOGLE_OAUTH_TOKEN_PATH: /data/google-oauth.json
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    ports:
      - "3000:3000"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - google_oauth_data:/data
    depends_on:
      backend:
        condition: service_healthy

volumes:
  google_oauth_data:
